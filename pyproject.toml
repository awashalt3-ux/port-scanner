[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portscan"
version = "1.0.0"
description = "Fast async port scanner with banner and HTTP header inspection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["rich>=13.0.0"]

[project.scripts]
portscan = "scanner:main"

[tool.setuptools]
py-modules = ["scanner"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# asyncio.TimeoutError is kept as-is for Python 3.9/3.10 compatibility.
ignore = ["UP041"]